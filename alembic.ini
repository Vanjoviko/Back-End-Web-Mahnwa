# Konfigurasi Alembic.
# URL database TIDAK ditulis di sini: env.py membacanya dari environment
# DATABASE_URL (dari .env.dev/.env.prod lewat `python -m app` atau Docker Compose).
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url sengaja dikosongkan; diisi runtime oleh alembic/env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
